[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browserget"
version = "1.0.1"
description = "Standalone CLI to install browsers and drivers without any framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Mathias Paulenko", email = "mathias.paulenko@outlook.com" },
]
keywords = ["browser", "chrome", "firefox", "edge", "chromedriver", "geckodriver", "edgedriver", "install", "automation", "testing", "selenium", "webdriver"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
]

[project.urls]
Homepage = "https://mathiaspaulenko.github.io/browserget/"
Repository = "https://github.com/MathiasPaulenko/browserget"
Changelog = "https://github.com/MathiasPaulenko/browserget/blob/main/CHANGELOG.md"
Issues = "https://github.com/MathiasPaulenko/browserget/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
    "mypy>=1.10",
    "build>=1.2",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.scripts]
browserget = "browserget.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["browserget"]

[tool.hatch.build.targets.sdist]
include = [
    "browserget",
    "tests",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
    "mkdocs.yml",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=browserget --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "network: marks tests that require real network access",
    "e2e: marks end-to-end tests that download real browsers",
]
